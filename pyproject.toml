[project]
name = "hermes-deploy"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = ["pyinfra==3.11.1"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# pyinfra's operation stubs predate StringCommand and re-exports it from pyinfra.api;
# settings attributes are injected from variants/ at runtime.
reportPrivateImportUsage = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
